[project]
name = "band-slack-backend"
version = "0.1.0"
description = "Slack-style multi-human, multi-agent chat on Band"
requires-python = ">=3.12"
dependencies = [
    "band-sdk[anthropic]>=5.1.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
