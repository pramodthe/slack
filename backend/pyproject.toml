[project]
name = "band-slack-backend"
version = "0.1.0"
description = "Slack-style multi-human, multi-agent chat on Band"
requires-python = ">=3.12"
dependencies = [
    "band-sdk[anthropic]>=5.1.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "daytona>=0.224.1",
    "deepagents>=0.7.26",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.11",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
